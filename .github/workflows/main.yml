name: Build AutoFreeze IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip AutoFreeze project
        run: |
          mkdir extracted
          unzip -q AutoFreeze_iOS_Project_with_Build.zip -d extracted
          ls -la extracted/AutoFreeze

      - name: Build unsigned AutoFreeze
        run: |
          cd extracted/AutoFreeze

          xcodebuild \
            -project AutoFreeze.xcodeproj \
            -scheme AutoFreeze \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create IPA
        run: |
          cd extracted/AutoFreeze

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AutoFreeze.app Payload/

          ditto -c -k --sequesterRsrc --keepParent \
            Payload AutoFreeze-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AutoFreeze-IPA
          path: extracted/AutoFreeze/AutoFreeze-unsigned.ipa
